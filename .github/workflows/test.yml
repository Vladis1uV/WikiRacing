name: GitHub Classroom Workflow

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]

permissions:
    checks: write
    actions: read
    contents: read

jobs:
    build:
        name: Autograding
        runs-on: ubuntu-latest
        if: github.actor != 'github-classroom[bot]'
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/gradle-build-action@v3
              with:
                  gradle-version: wrapper

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Cache Gradle packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            # W1: References extraction (5 pts)
            - name: W1 - References extraction
              id: w1
              uses: classroom-resources/autograding-command-grader@v1
              with:
                  test-name: W1 - References extraction (5 pts)
                  command: ./gradlew testW1
                  max-score: 5
                  timeout: 15

            # W2: Single-threaded search (6 pts)
            - name: W2 - Single-threaded search
              id: w2
              uses: classroom-resources/autograding-command-grader@v1
              with:
                  test-name: W2 - Single-threaded search (6 pts)
                  command: ./gradlew testW2
                  max-score: 6
                  timeout: 15

            # W3: Multi-threaded search (8 pts)
            - name: W3 - Multi-threaded search
              id: w3
              uses: classroom-resources/autograding-command-grader@v1
              with:
                  test-name: W3 - Multi-threaded search (8 pts)
                  command: ./gradlew testW3
                  max-score: 8
                  timeout: 15

            # CLI: Command-line interface (2 pts)
            - name: CLI - Command-line interface
              id: cli
              uses: classroom-resources/autograding-command-grader@v1
              with:
                  test-name: CLI - Command-line interface (2 pts)
                  command: ./gradlew testCli
                  max-score: 2
                  timeout: 15

            - name: Autograding Reporter
              uses: classroom-resources/autograding-grading-reporter@v1
              env:
                  W1_RESULTS: "${{steps.w1.outputs.result}}"
                  W2_RESULTS: "${{steps.w2.outputs.result}}"
                  W3_RESULTS: "${{steps.w3.outputs.result}}"
                  CLI_RESULTS: "${{steps.cli.outputs.result}}"
              with:
                  runners: w1,w2,w3,cli
